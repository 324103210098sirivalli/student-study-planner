apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: study-planner}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USERNAME/student-study-planner-backend:latest
        ports: [{containerPort: 5000}]
        env:
        - {name: PORT, value: "5000"}
        - {name: MONGO_URI, value: "mongodb://mongodb:27017/student_study_planner"}
        - {name: JWT_SECRET, value: "CHANGE_THIS_SECRET_BEFORE_DEPLOYING"}
        readinessProbe: {httpGet: {path: /api/health, port: 5000}, initialDelaySeconds: 15, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: 5000}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: study-planner}
spec:
  selector: {app: backend}
  ports: [{port: 5000, targetPort: 5000}]
